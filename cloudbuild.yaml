steps:
  # 1. Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/ai-document-intelligence/app:$COMMIT_SHA"
      - "."

  # 2. Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/ai-document-intelligence/app:$COMMIT_SHA"

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "ai-document-intelligence"
      - "--image"
      - "asia-south1-docker.pkg.dev/$PROJECT_ID/ai-document-intelligence/app:$COMMIT_SHA"
      - "--region"
      - "asia-south1"
      - "--service-account"
      - "ai-document-intelligence@$PROJECT_ID.iam.gserviceaccount.com"
      - "--quiet"

images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/ai-document-intelligence/app:$COMMIT_SHA"
options:
  logging: CLOUD_LOGGING_ONLY